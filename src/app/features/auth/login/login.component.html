<h2>Login</h2>
<p class="text-xs-center">
          @if (authType === "register") {
            <a [routerLink]="['/auth/login']">Have an account?</a>
          }

          @if (authType === "login") {
            <a [routerLink]="['/auth/register']">Need an account?</a>
          }
        </p>
<form (ngSubmit)="onSubmit()" #loginForm="ngForm">
  <div>
    <label for="username">Username:</label>
    <input
      type="text"
      id="username"
      name="username"
      required
      [(ngModel)]="username"
    />
  </div>

  <div>
    <label for="password">Password:</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      [(ngModel)]="password"
    />
  </div>

  <button type="submit" [disabled]="loginForm.invalid" class="my-button"> {{ title }}</button>
</form>
