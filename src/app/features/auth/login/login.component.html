<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
  <div class="mb-3">
    <label for="username" class="form-label">Username</label>
    <input
      type="text"
      id="username"
      class="form-control"
      formControlName="username"
     [class.is-invalid]="username.invalid && username.touched"
    />
    <div class="invalid-feedback" *ngIf="username.errors && username.touched">
      Username is required.
    </div>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      id="password"
      class="form-control"
      formControlName="password"
      [class.is-invalid]="password.touched && password.invalid"
    />
    <div class="invalid-feedback" *ngIf="password.errors && password.touched">
      Password is required.
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || isSubmitting">
    {{ isSubmitting ? 'Logging in...' : 'Login' }}
  </button>
</form>
