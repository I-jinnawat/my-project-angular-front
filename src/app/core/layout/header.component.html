<!-- Logged out users -->
<ul *ngIf="!(currentUser$ | async)" class="nav navbar-nav pull-xs-right">
  <li class="nav-item">
    <a class="nav-link" routerLink="/">Home</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" [routerLink]="'/auth/login'" routerLinkActive="active">Sign in</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" [routerLink]="'/auth/register'" routerLinkActive="active">Sign up</a>
  </li>
</ul>

<!-- Logged in users -->
<ul *ngIf="currentUser$ | async as currentUser" class="nav navbar-nav pull-xs-right">
  <li class="nav-item">
    <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link" routerLink="/editor" routerLinkActive="active">
      <i class="ion-compose"></i>&nbsp;New Article
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link" routerLink="/settings" routerLinkActive="active">
      <i class="ion-gear-a"></i>&nbsp;Settings
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link" [routerLink]="['/profile', currentUser.username]" routerLinkActive="active">
      <img *ngIf="currentUser.image" [src]="currentUser.image" class="user-pic" />
      {{ currentUser.username }}
    </a>
  </li>
  <li class="nav-item">
   <a class="nav-link" (click)="logout()" style="cursor: pointer;">Logou2t</a>
  </li>
</ul>
